[project]
name = "aegis"
version = "0.1.0"
description = "Recovery controller for distributed PyTorch training"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "rich>=13.9",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
k8s = ["kubernetes>=31.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
aegis = "aegis.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.uv]
# CPU wheels only; this project validates orchestration, not GPU kernels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: spawns real torchrun processes"]
